name: libya_point
description: "Libya Point - the comprehensive guide to apps, websites, banks, stores, jobs and live prices in Libya."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.7
  font_awesome_flutter: ^10.7.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  http: ^1.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  package_info_plus: ^8.1.0
  unity_ads_plugin: ^0.5.0
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
